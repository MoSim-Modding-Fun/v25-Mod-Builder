name: Build Installers

on:
  push:
    tags: ['v*.*.*']

jobs:
  # Windows and Linux still ship the Electron app. macOS does not - see build-macos
  # below: the Electron .dmg was getting flagged outright as malware by macOS's
  # XProtect (not just the milder "unidentified developer" Gatekeeper warning), which
  # is why mac/ (a native SwiftUI rewrite) exists at all. Building and releasing the
  # Electron .dmg here would just keep shipping the broken artifact.
  build-electron:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: installer-windows
            glob: app/dist/*.msi
          - os: ubuntu-latest
            artifact: installer-linux
            glob: |
              app/dist/*.AppImage
              app/dist/*.pacman

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      # fpm (used by electron-builder for the .pacman target) shells out to bsdtar,
      # which isn't installed by default on ubuntu-latest (only GNU tar is) - without
      # it fpm fails with a bare "exit code 127" (command not found).
      - name: Install pacman packaging dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build installer
        working-directory: app
        run: npm run dist

      # A file missing from build.files only fails once the app is actually packaged and
      # launched - `npm start` runs from the source tree and can't catch it. Shipping a
      # build whose main process dies instantly on "Cannot find module" has happened, so
      # boot the packaged binary headlessly and fail the build if it doesn't survive.
      - name: Smoke-test the packaged app
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get install -y xvfb
          set +e
          xvfb-run -a timeout 20 ./app/dist/linux-unpacked/v25-mod-builder > launch.log 2>&1
          set -e
          if grep -qiE "Cannot find module|A JavaScript error occurred|Uncaught Exception" launch.log; then
            echo "::error::Packaged app failed to start:"
            cat launch.log
            exit 1
          fi
          echo "Packaged app started cleanly."

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: error

  # Native Swift/SwiftUI app (mac/) - see mac/CONTEXT.md for why this exists instead of
  # the Electron build. GitHub's macos-latest runners ship Xcode/Swift out of the box,
  # so no toolchain setup is needed here (unlike a bare Command Line Tools install).
  build-macos:
    runs-on: macos-latest
    env:
      VERSION: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v5

      - name: Build (release)
        working-directory: app/mac
        run: swift build -c release

      # Wrapped in a minimal .app bundle (not shipped as a bare executable) - a raw SPM
      # binary run outside a bundle doesn't reliably get window-server privileges on
      # modern macOS. Ad-hoc signed (--sign -), not notarized: still unsigned-by-a-team,
      # so it'll show the milder "unidentified developer" Gatekeeper prompt, which is
      # the expected/acceptable outcome here - the goal was only to avoid the instant
      # malware-tier block the Electron build triggered.
      - name: Bundle .app
        working-directory: app/mac
        run: |
          APP="V25 Mod Builder.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp .build/release/V25ModBuilder "$APP/Contents/MacOS/V25 Mod Builder"
          cp ../build/icon.icns "$APP/Contents/Resources/AppIcon.icns"
          # UnityScriptInstaller.swift looks this up via Bundle.main.url(forResource:withExtension:)
          # at runtime - without it, the packaged .app can't install the Editor driver script
          # into a freshly-cloned template project.
          cp ../unity/AddressablesModExporter.cs "$APP/Contents/Resources/"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>V25 Mod Builder</string>
            <key>CFBundleIdentifier</key><string>com.v25.modbuilder</string>
            <key>CFBundleName</key><string>V25 Mod Builder</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundleShortVersionString</key><string>${VERSION#v}</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>LSMinimumSystemVersion</key><string>13.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSQuitAlwaysKeepsWindows</key><false/>
          </dict>
          </plist>
          PLIST
          codesign --force --deep --sign - "$APP"
          # Matches package.json's electron-builder artifactName style ("Mod Builder
          # Installer <Platform>.<ext>") so all three platforms read as one product.
          ditto -c -k --sequesterRsrc --keepParent "$APP" "Mod Builder Installer Mac.zip"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-macos
          path: "app/mac/Mod Builder Installer Mac.zip"
          if-no-files-found: error

  # Only runs when the push is a version tag (v1.0.0 etc) - creates a GitHub
  # Release and attaches the three installers built above to it.
  release:
    needs: [build-electron, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: installer-*
          merge-multiple: true

      # README.md's download table links to /releases/latest/download/<asset>, which
      # always resolves to the newest release - so those links never need editing per
      # release, but they DO silently 404 if an artifact ever gets renamed (via
      # artifactName in app/package.json, or the ditto line in build-macos). Catch that
      # here rather than shipping a release whose download table is dead. GitHub
      # dot-encodes spaces in asset filenames, so compare dot-encoded names.
      - name: Check README download links match the release assets
        run: |
          built=$(ls installers | tr ' ' '.' | sort -u)
          linked=$(grep -o 'releases/latest/download/[^)]*' README.md | sed 's|.*/||' | sort -u)
          missing=$(comm -23 <(echo "$linked") <(echo "$built"))
          if [ -n "$missing" ]; then
            echo "::error::README.md links to release assets that were not built:"
            echo "$missing"
            echo "Built assets were:"
            echo "$built"
            exit 1
          fi
          echo "All README download links match the built assets."

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
